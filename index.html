<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Anime Tracker</title>

    <link rel="manifest" href="manifest.json">

    <style>

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, Helvetica, sans-serif;
            background: #0b1628;
            color: #f0f3f8;
            min-height: 100vh;
        }

        /* HEADER */

        header {
            height: 65px;
            background: #152238;
            display: flex;
            align-items: center;
            padding: 0 25px;
            border-bottom: 1px solid #26364e;
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .logo {
            color: #3db4f2;
            font-size: 24px;
            font-weight: bold;
        }

        .nav {
            margin-left: auto;
            display: flex;
            gap: 25px;
        }

        .nav span {
            color: #9aa8bd;
            cursor: pointer;
        }

        .nav span:hover {
            color: #3db4f2;
        }


        /* MAIN */

        .container {
            max-width: 1050px;
            margin: auto;
            padding: 35px 20px;
        }


        /* PROFILE */

        .profile {
            display: flex;
            align-items: center;
            gap: 20px;
            margin-bottom: 35px;
        }

        .avatar {
            width: 70px;
            height: 70px;
            border-radius: 50%;
            background: #3db4f2;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 30px;
        }

        .profile h1 {
            font-size: 26px;
        }

        .profile p {
            color: #8e9bb0;
            margin-top: 5px;
        }


        /* STATISTICS */

        .stats {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 15px;
            margin-bottom: 35px;
        }

        .stat {
            background: #152238;
            border-radius: 8px;
            padding: 22px;
            border: 1px solid #22334b;
        }

        .stat-title {
            color: #8e9bb0;
            font-size: 14px;
            margin-bottom: 10px;
        }

        .stat-number {
            color: #3db4f2;
            font-size: 30px;
            font-weight: bold;
        }


        /* CONTENT */

        .section {
            background: #111d30;
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #22334b;
        }

        .section-header {
            padding: 20px;
            border-bottom: 1px solid #26364e;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .section-header h2 {
            font-size: 20px;
        }


        /* INPUT */

        .add-area {
            padding: 20px;
            display: flex;
            gap: 10px;
            background: #152238;
        }

        input {
            flex: 1;
            padding: 13px 15px;
            border: none;
            outline: none;
            border-radius: 6px;
            background: #0d1829;
            color: white;
            font-size: 15px;
            border: 1px solid #26364e;
        }

        input:focus {
            border-color: #3db4f2;
        }

        button {
            border: none;
            border-radius: 6px;
            padding: 12px 18px;
            background: #3db4f2;
            color: white;
            font-size: 14px;
            cursor: pointer;
            font-weight: bold;
        }

        button:hover {
            opacity: 0.9;
        }

        .clear {
            background: #26364e;
        }


        /* SEARCH */

        .search {
            padding: 15px 20px;
            background: #111d30;
        }

        .search input {
            width: 100%;
        }


        /* MOVIE LIST */

        #movieList {
            display: flex;
            flex-direction: column;
        }

        .movie {
            display: flex;
            align-items: center;
            padding: 16px 20px;
            border-bottom: 1px solid #223047;
            transition: background 0.2s;
        }

        .movie:hover {
            background: #18263c;
        }

        .movie-number {
            width: 35px;
            color: #6f7f96;
        }

        .movie-name {
            flex: 1;
            font-size: 16px;
        }

        .delete {
            background: transparent;
            color: #78869a;
            padding: 5px 10px;
            font-size: 18px;
        }

        .delete:hover {
            color: #ff6680;
        }


        /* EMPTY */

        .empty {
            padding: 50px 20px;
            text-align: center;
            color: #718097;
        }


        /* MOBILE */

        @media (max-width: 600px) {

            header {
                padding: 0 15px;
            }

            .nav {
                gap: 12px;
            }

            .nav span {
                display: none;
            }

            .container {
                padding: 25px 12px;
            }

            .stats {
                grid-template-columns: 1fr;
            }

            .add-area {
                flex-direction: column;
            }

            button {
                width: 100%;
            }

            .profile h1 {
                font-size: 22px;
            }

            .avatar {
                width: 60px;
                height: 60px;
            }
        }

    </style>
</head>


<body>


<header>

    <div class="logo">
        Anime Tracker
    </div>

    <div class="nav">
        <span>Home</span>
        <span>Anime</span>
        <span>Movies</span>
    </div>

</header>


<div class="container">


    <!-- PROFILE -->

    <div class="profile">

        <div class="avatar">
            🎬
        </div>

        <div>
            <h1>My Anime List</h1>
            <p>Personal anime & movie tracker</p>
        </div>

    </div>


    <!-- STATISTICS -->

    <div class="stats">

        <div class="stat">

            <div class="stat-title">
                MOVIES WATCHED
            </div>

            <div class="stat-number" id="count">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                COMPLETED
            </div>

            <div class="stat-number" id="completed">
                0
            </div>

        </div>


        <div class="stat">

            <div class="stat-title">
                LIST STATUS
            </div>

            <div class="stat-number">
                Active
            </div>

        </div>

    </div>


    <!-- MOVIE SECTION -->

    <div class="section">


        <div class="section-header">

            <h2>
                Movies
            </h2>

        </div>


        <!-- ADD -->

        <div class="add-area">

            <input
                type="text"
                id="movieName"
                placeholder="Add a movie..."
            >

            <button onclick="addMovie()">
                + Add
            </button>

            <button
                class="clear"
                onclick="clearMovies()"
            >
                Clear
            </button>

        </div>


        <!-- SEARCH -->

        <div class="search">

            <input
                type="text"
                id="search"
                placeholder="Search your movies..."
                oninput="searchMovies()"
            >

        </div>


        <!-- LIST -->

        <div id="movieList"></div>


    </div>

</div>


<script>

    /* LOAD SAVED MOVIES */

    let movies =
        JSON.parse(localStorage.getItem("myMovies")) || [];


    /* ADD MOVIE */

    function addMovie() {

        let input =
            document.getElementById("movieName");

        let movie =
            input.value.trim();


        if (movie === "") {

            alert("Please enter a movie name.");

            return;
        }


        movies.push(movie);


        localStorage.setItem(
            "myMovies",
            JSON.stringify(movies)
        );


        input.value = "";


        displayMovies();
    }



    /* DISPLAY */

    function displayMovies(list = movies) {

        let movieList =
            document.getElementById("movieList");


        movieList.innerHTML = "";


        if (list.length === 0) {

            movieList.innerHTML =
                `<div class="empty">
                    No movies found.
                 </div>`;

        }


        list.forEach(function(movie, index) {

            let originalIndex =
                movies.indexOf(movie);


            let div =
                document.createElement("div");

            div.className = "movie";


            div.innerHTML = `

                <div class="movie-number">
                    ${index + 1}
                </div>

                <div class="movie-name">
                    ${movie}
                </div>

                <button
                    class="delete"
                    onclick="deleteMovie(${originalIndex})"
                >
                    ×
                </button>

            `;


            movieList.appendChild(div);

        });


        updateStats();
    }



    /* DELETE */

    function deleteMovie(index) {

        movies.splice(index, 1);


        localStorage.setItem(
            "myMovies",
            JSON.stringify(movies)
        );


        displayMovies();
    }



    /* SEARCH */

    function searchMovies() {

        let search =
            document
            .getElementById("search")
            .value
            .toLowerCase();


        let filtered =
            movies.filter(function(movie) {

                return movie
                    .toLowerCase()
                    .includes(search);

            });


        displayMovies(filtered);
    }



    /* CLEAR */

    function clearMovies() {

        if (
            confirm(
                "Delete all your movies?"
            )
        ) {

            movies = [];


            localStorage.removeItem(
                "myMovies"
            );


            displayMovies();

        }

    }



    /* STATISTICS */

    function updateStats() {

        document
            .getElementById("count")
            .textContent =
            movies.length;


        document
            .getElementById("completed")
            .textContent =
            movies.length;

    }



    /* INITIAL LOAD */

    displayMovies();



    /* SERVICE WORKER */

    if ("serviceWorker" in navigator) {

        navigator.serviceWorker.register("sw.js");

    }

</script>


</body>

</html>
