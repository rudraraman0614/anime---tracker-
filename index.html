<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>My Anime List</title>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #0f1117;
    color: white;
}

/* Header */
header {
    background: #151820;
    padding: 20px;
    text-align: center;
    border-bottom: 1px solid #292d38;
}

header h1 {
    margin: 0 0 15px;
}

/* Search */
#search {
    width: 90%;
    max-width: 600px;
    padding: 13px;
    border-radius: 8px;
    border: none;
    outline: none;
    font-size: 16px;
}

/* Add section */
.add-section {
    max-width: 600px;
    margin: 25px auto;
    padding: 20px;
    background: #181b24;
    border-radius: 10px;
}

.add-section h2 {
    margin-top: 0;
}

input, textarea {
    width: 100%;
    padding: 12px;
    margin: 8px 0;
    border: none;
    border-radius: 6px;
    background: #252936;
    color: white;
}

textarea {
    height: 100px;
    resize: vertical;
}

button {
    padding: 10px 16px;
    border: none;
    border-radius: 6px;
    cursor: pointer;
    background: #3db4f2;
    color: white;
    font-weight: bold;
}

button:hover {
    opacity: 0.85;
}

/* Anime grid */
#animeList {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 20px;
    padding: 20px;
    max-width: 1200px;
    margin: auto;
}

/* Anime card */
.anime-card {
    background: #181b24;
    border-radius: 10px;
    overflow: hidden;
    border: 1px solid #292d38;
}

.anime-card img {
    width: 100%;
    height: 280px;
    object-fit: cover;
}

.anime-info {
    padding: 15px;
}

.anime-info h3 {
    margin-top: 0;
}

.rating {
    color: #ffd166;
    font-weight: bold;
}

.description {
    color: #b8bcc8;
    line-height: 1.5;
}

.delete-btn {
    background: #e5484d;
    margin-top: 8px;
}

.edit-btn {
    background: #555b6e;
    margin-top: 8px;
}
</style>
</head>

<body>

<header>
    <h1>My Anime List</h1>

    <input
        type="text"
        id="search"
        placeholder="Search anime..."
        onkeyup="searchAnime()"
    >
</header>


<!-- Add Anime -->
<section class="add-section">

    <h2>Add Anime</h2>

    <input
        type="text"
        id="animeName"
        placeholder="Anime name"
    >

    <input
        type="number"
        id="animeRating"
        placeholder="Rating (1-10)"
        min="1"
        max="10"
    >

    <input
        type="text"
        id="animeImage"
        placeholder="Image URL"
    >

    <textarea
        id="animeDescription"
        placeholder="Your description..."
    ></textarea>

    <button onclick="addAnime()">Add Anime</button>

</section>


<!-- Anime cards -->
<div id="animeList"></div>


<script>

/* Load saved anime */
let animeList = JSON.parse(localStorage.getItem("animeList")) || [];


/* Display anime */
function displayAnime(list = animeList) {

    const container = document.getElementById("animeList");

    container.innerHTML = "";

    list.forEach((anime, index) => {

        container.innerHTML += `

        <div class="anime-card">

            <img
                src="${anime.image}"
                onerror="this.src='https://via.placeholder.com/300x400?text=No+Image'"
            >

            <div class="anime-info">

                <h3>${anime.name}</h3>

                <p class="rating">
                    ⭐ ${anime.rating}/10
                </p>

                <p class="description">
                    ${anime.description}
                </p>

                <button
                    class="edit-btn"
                    onclick="editAnime(${index})"
                >
                    Edit
                </button>

                <button
                    class="delete-btn"
                    onclick="deleteAnime(${index})"
                >
                    Delete
                </button>

            </div>

        </div>

        `;
    });
}


/* Add anime */
function addAnime() {

    const name = document.getElementById("animeName").value;
    const rating = document.getElementById("animeRating").value;
    const image = document.getElementById("animeImage").value;
    const description =
        document.getElementById("animeDescription").value;

    if (!name || !rating || !description) {

        alert("Please fill in the required fields.");

        return;
    }

    const anime = {

        name: name,

        rating: rating,

        image: image ||
        "https://via.placeholder.com/300x400?text=No+Image",

        description: description
    };

    animeList.push(anime);

    saveAnime();

    clearForm();

    displayAnime();
}


/* Search */
function searchAnime() {

    const search =
        document.getElementById("search").value.toLowerCase();

    const filtered =
        animeList.filter(anime =>
            anime.name.toLowerCase().includes(search)
        );

    displayAnime(filtered);
}


/* Delete */
function deleteAnime(index) {

    if (confirm("Delete this anime?")) {

        animeList.splice(index, 1);

        saveAnime();

        displayAnime();
    }
}


/* Edit */
function editAnime(index) {

    const anime = animeList[index];

    document.getElementById("animeName").value =
        anime.name;

    document.getElementById("animeRating").value =
        anime.rating;

    document.getElementById("animeImage").value =
        anime.image;

    document.getElementById("animeDescription").value =
        anime.description;

    animeList.splice(index, 1);

    saveAnime();

    displayAnime();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* Save */
function saveAnime() {

    localStorage.setItem(
        "animeList",
        JSON.stringify(animeList)
    );
}


/* Clear form */
function clearForm() {

    document.getElementById("animeName").value = "";

    document.getElementById("animeRating").value = "";

    document.getElementById("animeImage").value = "";

    document.getElementById("animeDescription").value = "";
}


/* Initial display */
displayAnime();

</script>

</body>
</html>
